# ============================================================
# config.yaml - every setting of the assistant lives here.
# The brief requires the assistant to stay independent of its
# corpus. Swapping the knowledge base must mean editing this
# file, never the code. Values are null until the phase that
# decides them, with the reason recorded in the README.
# ============================================================

corpus:                                      # which documentation we answer from
  name: "fastapi"                            # our chosen tool, among the five the brief allows
  base_url: "https://fastapi.tiangolo.com/"  # the public site, used for the citation links
  nav_url: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/mkdocs.yml"  # the site's own navigation file
  source_base: "https://raw.githubusercontent.com/fastapi/fastapi/master/docs/en/docs/"   # where the Markdown sources live
  repo_raw_base: "https://raw.githubusercontent.com/fastapi/fastapi/master/"              # where the code examples live
  exclude_sections: ["reference"]            # auto-generated API dumps; dense and bad for retrieval
  exclude_pages:                             # community and meta pages, not technical documentation
    - "release-notes.md"                     # the full changelog, enormous and repetitive
    - "fastapi-people.md"                    # the list of contributors
    - "help-fastapi.md"                      # how to support the project
    - "contributing.md"                      # how to contribute to FastAPI itself
    - "translations.md"                      # translation guidelines
    - "external-links.md"                    # a list of third-party links
    - "newsletter.md"                        # newsletter signup
    - "management.md"                        # project governance
    - "project-generation.md"                # links to project templates
  min_pages: 30                              # the brief's minimum; the script fails loudly below it
  min_page_characters: 300                   # below this a page is a navigation stub, not content
  request_delay_seconds: 0.5                 # pause between pages, to be polite to the server
  user_agent: "bibliotheque-alexandrie-bot/1.0 (student project)"  # identifies our script honestly
  raw_dir: "data/raw"                        # folder where downloaded pages are saved
  processed_dir: "data/processed"            # folder where the chunks are written
  manifest: "corpus_manifest.json"           # committed list of every page, its URL and date

chunking:                                    # how documents are cut into passages
  sizes_to_test: [500, 1500]                 # the two sizes the brief asks us to compare
  overlap: 100                               # characters repeated between neighbours, so ideas are not cut in half
  chosen: 500                                # Phase 3 measured 90% recall@3 at 500 vs 85% at 1500

embeddings:                                  # the model that turns text into numbers
  model: "intfloat/multilingual-e5-base"     # open source, MIT licence, built for cross-language search
  device: "cpu"                              # run on the processor; no graphics card needed
  query_prefix: "query: "                    # the prefix this model expects on a question
  passage_prefix: "passage: "                # the prefix it expects on a document passage
  batch_size: 16                             # how many passages to process at once, to limit memory use

vector_store:                                # where the vectors are kept
  provider: "chroma"                         # Chroma, one of the two options in the brief
  path: "chroma_db"                          # folder holding the database on disk
  collection: "fastapi_docs"                 # name of the collection inside it

retrieval:                                   # how passages are found at question time
  top_k: 3                                   # how many passages we fetch; the brief measures the top 3
  min_similarity: null                       # Phase 5 sets the refusal threshold

llm:                                         # the model that writes the answer
  provider: null                             # Phase 4 compares a local model with OpenRouter
  model: null                                # Phase 4 sets the exact model name
  temperature: 0.0                           # 0 means the most predictable answer, not a creative one
  max_tokens: 600                            # longest answer we allow, to control cost and rambling

cache:                                       # the brief asks for a response cache
  enabled: true                              # on by default
  path: "data/cache.sqlite"                  # stored in data/, which Git ignores